<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXA Admin — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#09090b;--panel:#121216;--panel2:#18181e;--line:#292930;--text:#f3eee6;--muted:#99949a;--gold:#d8b58e;--gold2:#b58d62;--red:#e06a65;--green:#54c58a;--blue:#80aee8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0,#282016,transparent 55%)}
.login-card{width:min(430px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 25px 80px #0008}
.brand{font:600 36px Georgia;letter-spacing:.35em;color:var(--gold);direction:ltr;text-align:center}.muted{color:var(--muted)}.login h1{text-align:center;font-size:19px;margin:8px 0 24px}
.layout{min-height:100vh;display:grid;grid-template-columns:255px 1fr}.side{background:#0d0d10;border-left:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}.side .brand{font-size:29px;margin:4px 0 24px}.side small{display:block;color:var(--muted);text-align:center;margin:-16px 0 22px}
.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#bcb7b0;text-align:right;padding:11px 13px;border-radius:10px;font-weight:600}.nav button:hover,.nav button.active{background:#29231c;color:var(--gold)}.nav button span{display:inline-block;width:28px}
.main{min-width:0;padding:24px clamp(14px,3vw,38px) 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.top h1{font-size:24px;margin:0}.top-actions{display:flex;gap:8px;align-items:center}.userpill{border:1px solid var(--line);padding:7px 12px;border-radius:30px;color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 14px;border-radius:10px;font-weight:700}.btn.primary{background:linear-gradient(135deg,#e5c7a5,#b98d61);color:#15110d;border:0}.btn.danger{color:#ff9b94;border-color:#6d3432}.btn.good{color:#8ce0b4;border-color:#285a42}.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px}.stat label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:26px;margin-top:6px;color:var(--gold)}.stat small{color:var(--muted)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar h2{font-size:17px;margin:0}.tools{display:flex;gap:8px;flex-wrap:wrap}.field{display:grid;gap:5px;margin:11px 0}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;background:#0b0b0e;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px 12px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--gold2)}textarea{min-height:90px;resize:vertical}
.search{width:min(290px,70vw)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:right;padding:12px 13px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}th{color:var(--gold);font-weight:700;background:#17171c;position:sticky;top:0}tr:last-child td{border-bottom:0}.pill{display:inline-block;border:1px solid var(--line);padding:3px 9px;border-radius:30px;font-size:11px;color:var(--muted)}.pill.green{color:var(--green);border-color:#285a42}.pill.red{color:#ff9b94;border-color:#6d3432}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions .btn{padding:5px 9px;font-size:11px}.empty{text-align:center;padding:40px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:center;padding:16px}.modalbox{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.modalhead h2{font-size:18px;margin:0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.span2{grid-column:1/-1}.checkrow{display:flex;gap:9px;align-items:center;margin:12px 0;color:var(--muted);font-size:13px}.checkrow input{width:auto}.toast{position:fixed;bottom:20px;left:20px;z-index:40;background:#e4c39e;color:#17110b;padding:11px 17px;border-radius:10px;font-weight:700;box-shadow:0 8px 30px #0008}
.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{padding:7px 12px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px}.tabs button.active{color:var(--gold);border-color:var(--gold2);background:#211c16}
.note{padding:12px;border:1px dashed #68533d;border-radius:10px;color:var(--muted);font-size:12px;margin:12px 0}.thumb{width:48px;height:58px;object-fit:cover;border-radius:7px;vertical-align:middle;margin-left:8px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{height:auto;position:relative;padding:10px 12px;border-left:0;border-bottom:1px solid var(--line)}.side .brand{font-size:25px;margin:0}.side small{display:none}.nav{display:flex;overflow:auto;padding-top:10px}.nav button{white-space:nowrap;padding:8px 10px}.main{padding-top:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.top h1{font-size:19px}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.stat strong{font-size:22px}}
</style></head>
<body>
<section id="login" class="login"><div class="login-card"><div class="brand">NEXA</div><h1>لوحة إدارة المتجر</h1>
<div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com"></div>
<div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
<button class="btn primary" style="width:100%;margin-top:12px" id="loginBtn">تسجيل الدخول</button>
<p class="muted" style="font-size:11px;text-align:center;margin-top:16px">الدخول متاح لحسابات الإدارة المصرّح لها فقط</p></div></section>
<div id="app" class="layout hidden">
<aside class="side"><div class="brand">NEXA</div><small>CONTROL CENTER</small><nav class="nav" id="nav">
<button data-page="dashboard" class="active"><span>▦</span>نظرة عامة</button>
<button data-page="orders"><span>▤</span>الطلبات</button><button data-page="products"><span>◇</span>المنتجات</button>
<button data-page="inventory"><span>▥</span>المخزون</button><button data-page="categories"><span>▧</span>الأقسام</button>
<button data-page="customers"><span>♙</span>العملاء</button><button data-page="promotions"><span>％</span>الكوبونات والعروض</button>
<button data-page="content"><span>▣</span>محتوى الموقع</button><button data-page="settings"><span>⚙</span>الإعدادات</button>
<button data-page="analytics"><span>◷</span>التقارير والمصروفات</button><button data-page="admins"><span>♧</span>المديرون</button><button data-page="logs"><span>☷</span>سجل النشاط</button>
</nav></aside>
<main class="main"><header class="top"><h1 id="pageTitle">نظرة عامة</h1><div class="top-actions"><span class="userpill" id="who">Admin</span><button class="btn" id="refresh">↻ تحديث</button><button class="btn danger" id="logout">خروج</button></div></header><div id="view"></div></main>
</div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle"></h2><button class="btn" id="closeModal">✕</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const SUPABASE_URL='https://sehuddkxofsumrkqmjdi.supabase.co';
const SUPABASE_KEY='sb_publishable_IMcAUN7FUNcryjCzZeROmw_YaQee';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(Number(n)||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م';
const statuses={new:'جديد',confirmed:'تم التأكيد',processing:'قيد التجهيز',ready_to_ship:'جاهز للشحن',shipped:'تم الشحن',delivered:'تم التسليم',cancelled:'ملغي',returned:'مرتجع'};
const perms={dashboard:['analytics','orders','products','inventory','content','promotions','settings','admins','logs'],orders:['orders'],products:['products','products_read'],inventory:['inventory'],categories:['products'],customers:['customers'],promotions:['promotions'],content:['content'],settings:['settings'],analytics:['analytics'],admins:['admins'],logs:['logs']};
let user=null,admin=null,permissionSet=new Set(),current='dashboard',cache={};
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),3000)}
function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}
function can(p){return permissionSet.has(p)||permissionSet.has('super_admin')}
function guard(p){if(!can(p)){toast('ليس لديك صلاحية لهذا القسم');return false}return true}
async function init(){
 const {data:{session}}=await sb.auth.getSession();if(session)await verify();
}
async function verify(){
 const {data:u}=await sb.auth.getUser();user=u.user;if(!user){showLogin();return}
 const {data:ok,error}=await sb.rpc('is_admin');if(error||!ok){await sb.auth.signOut();showLogin();toast('الحساب غير مضاف كمدير في قاعدة البيانات');return}
 const {data:a,error:ae}=await sb.from('admin_users').select('*').eq('user_id',user.id).single();
 if(ae||!a?.is_active){await sb.auth.signOut();showLogin();toast('حساب الإدارة غير نشط');return}
 admin=a;const {data:rp}=await sb.from('role_permissions').select('permission').eq('role',a.role);
 permissionSet=new Set((rp||[]).map(x=>x.permission));if(a.role==='super_admin')permissionSet.add('super_admin');
 $('#who').textContent=(a.full_name||user.email)+' · '+a.role;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');buildNav();await go('dashboard');
}
function showLogin(){$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}
function buildNav(){document.querySelectorAll('#nav button').forEach(b=>{const p=b.dataset.page,need=perms[p]||[];b.classList.toggle('hidden',p!=='dashboard'&&!need.some(can))})}
async function go(page){current=page;const b=$(`#nav [data-page="${page}"]`);if(!b||b.classList.contains('hidden'))return toast('ليس لديك صلاحية');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));$('#pageTitle').textContent=b.textContent.trim();$('#view').innerHTML='<div class="empty">جاري تحميل البيانات…</div>';try{await pages[page]()}catch(e){console.error(e);$('#view').innerHTML=`<div class="card">حدث خطأ: ${esc(e.message)}</div>`}}
async function rows(table,query='*',order='created_at',asc=false){const r=await sb.from(table).select(query).order(order,{ascending:asc});if(r.error)throw r.error;cache[table]=r.data||[];return r.data||[]}
function tableHTML(headers,body){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body||`<tr><td colspan="${headers.length}" class="empty">لا توجد بيانات</td></tr>`}</tbody></table></div>`}
const pages={
 dashboard:async()=>{const [o,p,c,ex]=await Promise.all([rows('orders','id,total,status,created_at','created_at'),rows('products','id,status','created_at'),rows('customers','id','created_at'),rows('expenses','amount','spent_on')]);const today=new Date().toISOString().slice(0,10);const todays=o.filter(x=>x.created_at?.slice(0,10)===today);const revenue=o.filter(x=>['confirmed','processing','ready_to_ship','shipped','delivered'].includes(x.status)).reduce((s,x)=>s+Number(x.total),0);$('#view').innerHTML=`<div class="grid"><div class="stat"><label>إجمالي الطلبات</label><strong>${o.length}</strong><small>كل الطلبات المسجلة</small></div><div class="stat"><label>طلبات اليوم</label><strong>${todays.length}</strong><small>من بداية اليوم</small></div><div class="stat"><label>المنتجات</label><strong>${p.length}</strong><small>${p.filter(x=>x.status==='published').length} منشور</small></div><div class="stat"><label>العملاء</label><strong>${c.length}</strong><small>إجمالي العملاء</small></div><div class="stat"><label>إجمالي المبيعات المؤكدة</label><strong>${money(revenue)}</strong><small>لا تشمل الطلبات الجديدة والملغاة</small></div><div class="stat"><label>المصروفات المسجلة</label><strong>${money(ex.reduce((s,x)=>s+Number(x.amount),0))}</strong><small>من جدول المصروفات</small></div></div><div class="toolbar"><h2>أحدث الطلبات</h2><button class="btn" onclick="go('orders')">عرض كل الطلبات ←</button></div>${tableHTML(['رقم الطلب','العميل','الإجمالي','الحالة','التاريخ'],o.slice(0,7).map(x=>`<tr><td>${esc(x.ref||x.id.slice(0,8))}</td><td>${esc(x.customer_name||'—')}</td><td>${money(x.total)}</td><td>${statuses[x.status]||x.status}</td><td>${new Date(x.created_at).toLocaleString('ar-EG')}</td></tr>`).join(''))}`},
 orders:async()=>{if(!guard('orders'))return;const d=await rows('orders','*','created_at');$('#view').innerHTML=`<div class="toolbar"><h2>إدارة الطلبات (${d.length})</h2><div class="tools"><input class="search" id="q" placeholder="بحث بالرقم أو الاسم أو الهاتف"><select id="statusFilter"><option value="">كل الحالات</option>${Object.entries(statuses).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div></div><div id="tbl"></div>`;const draw=()=>{const q=$('#q').value.toLowerCase(),st=$('#statusFilter').value;const a=d.filter(x=>(!st||x.status===st)&&[x.ref,x.customer_name,x.customer_phone].join(' ').toLowerCase().includes(q));$('#tbl').innerHTML=tableHTML(['رقم الطلب','العميل','الهاتف','الإجمالي','الدفع','الحالة','التاريخ','إجراءات'],a.map(x=>`<tr><td><b>${esc(x.ref)}</b></td><td>${esc(x.customer_name)}</td><td>${esc(x.customer_phone)}</td><td>${money(x.total)}</td><td>${esc(x.payment_status||'unpaid')}</td><td><span class="pill">${statuses[x.status]||x.status}</span></td><td>${new Date(x.created_at).toLocaleDateString('ar-EG')}</td><td><div class="actions"><button class="btn" onclick="orderDetails('${x.id}')">تفاصيل</button><button class="btn primary" onclick="changeStatus('${x.id}','${x.status}')">تحديث الحالة</button></div></td></tr>`).join(''))};$('#q').oninput=draw;$('#statusFilter').onchange=draw;draw()},
 products:async()=>{if(!guard('products')&&!guard('products_read'))return;const d=await rows('products','*,category:categories(name),product_images(url,is_primary)','created_at');$('#view').innerHTML=`<div class="toolbar"><h2>كتالوج المنتجات (${d.length})</h2><div class="tools"><input id="q" class="search" placeholder="ابحث عن منتج"><button class="btn primary" onclick="productForm()">＋ إضافة منتج</button></div></div><div id="tbl"></div>`;const draw=()=>{const q=$('#q').value.toLowerCase();const a=d.filter(x=>x.name.toLowerCase().includes(q));$('#tbl').innerHTML=tableHTML(['المنتج','القسم','السعر','التكلفة','الحالة','مميز','إجراءات'],a.map(x=>`<tr><td>${x.product_images?.[0]?.url?`<img class="thumb" src="${esc(x.product_images[0].url)}">`:''}<b>${esc(x.name)}</b><div class="muted">${esc(x.sku||'')}</div></td><td>${esc(x.category?.name||'—')}</td><td>${money(x.price)}</td><td>${money(x.cost)}</td><td><span class="pill">${x.status}</span></td><td>${x.is_featured?'نعم':'—'}</td><td><div class="actions"><button class="btn" onclick="productForm('${x.id}')">تعديل</button><button class="btn danger" onclick="deleteRow('products','${x.id}')">حذف</button></div></td></tr>`).join(''))};$('#q').oninput=draw;draw()},
 inventory:async()=>{if(!guard('inventory'))return;const d=await sb.from('product_variants').select('*,products(name),inventory(*)').order('created_at');if(d.error)throw d.error;const a=d.data||[];$('#view').innerHTML=`<div class="toolbar"><h2>المخزون والمتغيرات</h2><span class="pill">تعديل الكمية يتم بدالة آمنة مع تسجيل السبب</span></div>${tableHTML(['المنتج','المقاس','اللون','الكمية','محجوز','تتبع المخزون','إجراء'],a.map(v=>{const i=v.inventory?.[0]||{};return `<tr><td>${esc(v.products?.name)}</td><td>${esc(v.size||'—')}</td><td>${esc(v.color||'—')}</td><td>${i.track_stock?i.quantity:'غير محدد'}</td><td>${i.reserved||0}</td><td>${i.track_stock?'مفعل':'غير مفعل'}</td><td><button class="btn primary" onclick="adjustStock('${v.id}','${esc(v.products?.name||'')}')">تعديل الكمية</button></td></tr>`}).join(''))}`},
 categories:async()=>{if(!guard('products'))return;const d=await rows('categories','*','sort_order',true);$('#view').innerHTML=`<div class="toolbar"><h2>الأقسام</h2><button class="btn primary" onclick="categoryForm()">＋ إضافة قسم</button></div>${tableHTML(['الاسم','الرابط المختصر','الترتيب','الحالة','إجراءات'],d.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.slug)}</td><td>${x.sort_order}</td><td>${x.is_active?'نشط':'مخفي'}</td><td><div class="actions"><button class="btn" onclick="categoryForm('${x.id}')">تعديل</button><button class="btn danger" onclick="deleteRow('categories','${x.id}')">حذف</button></div></td></tr>`).join(''))}`},
 customers:async()=>{if(!guard('customers'))return;const d=await rows('customers');$('#view').innerHTML=`<div class="toolbar"><h2>العملاء (${d.length})</h2><input id="q" class="search" placeholder="بحث بالاسم أو الهاتف"></div><div id="tbl"></div>`;const draw=()=>{const q=$('#q').value.toLowerCase();$('#tbl').innerHTML=tableHTML(['الاسم','الهاتف','البريد','الشريحة','ملاحظات','تاريخ التسجيل'],d.filter(x=>[x.name,x.phone,x.email].join(' ').toLowerCase().includes(q)).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.email||'—')}</td><td>${esc(x.segment)}</td><td>${esc(x.notes||'—')}</td><td>${new Date(x.created_at).toLocaleDateString('ar-EG')}</td></tr>`).join(''))};$('#q').oninput=draw;draw()},
 promotions:async()=>{if(!guard('promotions'))return;const [c,p]=await Promise.all([rows('coupons'),rows('promotions')]);$('#view').innerHTML=`<div class="tabs"><button class="active" data-tab="coupons">الكوبونات</button><button data-tab="promos">العروض التلقائية</button></div><div id="promoArea"></div>`;window.drawPromo=tab=>{document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#promoArea').innerHTML=tab==='coupons'?`<div class="toolbar"><h2>كوبونات الخصم</h2><button class="btn primary" onclick="couponForm()">＋ كوبون جديد</button></div>${tableHTML(['الكود','النوع','القيمة','الحد الأدنى','المستخدم','نشط','إجراءات'],c.map(x=>`<tr><td><b>${esc(x.code)}</b></td><td>${x.discount_type}</td><td>${x.value}${x.discount_type==='percent'?'%':' ج'}</td><td>${money(x.min_order)}</td><td>${x.used_count}${x.usage_limit?'/'+x.usage_limit:''}</td><td>${x.is_active?'نعم':'لا'}</td><td><div class="actions"><button class="btn" onclick="couponForm('${x.id}')">تعديل</button><button class="btn danger" onclick="deleteRow('coupons','${x.id}')">حذف</button></div></td></tr>`).join(''))}`:`<div class="toolbar"><h2>العروض التلقائية</h2><button class="btn primary" onclick="promotionForm()">＋ عرض جديد</button></div>${tableHTML(['الاسم','النوع','القيمة','ينطبق على','نشط','إجراءات'],p.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.discount_type}</td><td>${x.value}${x.discount_type==='percent'?'%':' ج'}</td><td>${x.applies_to}</td><td>${x.is_active?'نعم':'لا'}</td><td><div class="actions"><button class="btn" onclick="promotionForm('${x.id}')">تعديل</button><button class="btn danger" onclick="deleteRow('promotions','${x.id}')">حذف</button></div></td></tr>`).join(''))}`};window.drawPromo('coupons');document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>drawPromo(b.dataset.tab))},

 settings:async()=>{if(!guard('settings'))return;const [w,ship,pay]=await Promise.all([rows('website_settings','*','key',true),rows('shipping_settings','*','sort_order',true),rows('payment_settings','*','sort_order',true)]);$('#view').innerHTML=`<div class="toolbar"><h2>إعدادات المتجر العامة</h2></div><div class="card"><div class="toolbar"><h2>مفاتيح الموقع</h2><button class="btn primary" onclick="settingForm()">＋ إعداد جديد</button></div>${tableHTML(['المفتاح','القيمة','عام','إجراء'],w.map(x=>`<tr><td>${esc(x.key)}</td><td>${esc(JSON.stringify(x.value))}</td><td>${x.is_public?'نعم':'لا'}</td><td><button class="btn" onclick="settingForm('${esc(x.key)}')">تعديل</button></td></tr>`).join(''))}</div><div class="toolbar"><h2>مناطق الشحن</h2><button class="btn primary" onclick="shippingForm()">＋ منطقة/سعر</button></div>${tableHTML(['المنطقة','السعر','شحن مجاني بعد','المدة','متاح','إجراء'],ship.map(x=>`<tr><td>${esc(x.region||'الافتراضي')}</td><td>${money(x.fee)}</td><td>${x.free_threshold??'—'}</td><td>${x.est_days_min??'—'} - ${x.est_days_max??'—'}</td><td>${x.is_available?'نعم':'لا'}</td><td><button class="btn" onclick="shippingForm('${x.id}')">تعديل</button></td></tr>`).join(''))}<div class="toolbar"><h2>طرق الدفع</h2></div>${tableHTML(['الطريقة','الاسم الظاهر','تعليمات','مفعلة','إجراء'],pay.map(x=>`<tr><td>${x.method}</td><td>${esc(x.label)}</td><td>${esc(x.instructions)}</td><td>${x.is_enabled?'نعم':'لا'}</td><td><button class="btn" onclick="paymentForm('${esc(x.method)}')">تعديل</button></td></tr>`).join(''))}`},
 analytics:async()=>{if(!guard('analytics'))return;const [o,e]=await Promise.all([rows('orders','*','created_at'),rows('expenses','*','spent_on')]);const rev=o.filter(x=>['confirmed','processing','ready_to_ship','shipped','delivered'].includes(x.status)).reduce((s,x)=>s+Number(x.total),0),cost=e.reduce((s,x)=>s+Number(x.amount),0);$('#view').innerHTML=`<div class="grid"><div class="stat"><label>مبيعات الطلبات غير الملغاة</label><strong>${money(rev)}</strong></div><div class="stat"><label>المصروفات</label><strong>${money(cost)}</strong></div><div class="stat"><label>صافي تقريبي</label><strong>${money(rev-cost)}</strong><small>لا يشمل تكلفة البضاعة إلا إذا سُجلت كمصروف</small></div><div class="stat"><label>عدد الطلبات</label><strong>${o.length}</strong></div></div><div class="toolbar"><h2>المصروفات</h2><button class="btn primary" onclick="expenseForm()">＋ تسجيل مصروف</button></div>${tableHTML(['البند','التصنيف','المبلغ','التاريخ','إجراء'],e.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${x.spent_on}</td><td><button class="btn danger" onclick="deleteRow('expenses','${x.id}')">حذف</button></td></tr>`).join(''))}`},

async function orderDetails(id){const {data:o,error}=await sb.from('orders').select('*,order_items(*)').eq('id',id).single();if(error)return toast(error.message);modal('تفاصيل الطلب '+o.ref,`<div class="formgrid"><div><b>العميل:</b> ${esc(o.customer_name)}</div><div><b>الهاتف:</b> ${esc(o.customer_phone)}</div><div class="span2"><b>العنوان:</b> ${esc(o.customer_address)}</div><div><b>الإجمالي:</b> ${money(o.total)}</div><div><b>الشحن:</b> ${money(o.shipping_fee)}</div><div><b>الحالة:</b> ${statuses[o.status]}</div><div><b>الدفع:</b> ${o.payment_status}</div></div><h3>المنتجات</h3>${(o.order_items||[]).map(i=>`<div class="note">${esc(i.name)} — ${esc(i.size||'')} ${esc(i.color||'')} × ${i.qty} — ${money(i.line_total)}</div>`).join('')}<div class="field"><label>ملاحظات داخلية</label><textarea id="internalNotes">${esc(o.internal_notes||'')}</textarea></div><div class="field"><label>حالة الدفع</label><select id="payStatus">${['unpaid','paid','partial','refunded'].map(x=>`<option ${o.payment_status===x?'selected':''}>${x}</option>`)}</select></div><button class="btn primary" onclick="saveOrderMeta('${id}')">حفظ بيانات الطلب</button><button class="btn" onclick="changeStatus('${id}','${o.status}')">تغيير الحالة</button>`)}
async function saveOrderMeta(id){const {error}=await sb.from('orders').update({internal_notes:$('#internalNotes').value,payment_status:$('#payStatus').value}).eq('id',id);if(error)return toast(error.message);toast('تم الحفظ');closeModal();go('orders')}
async function changeStatus(id,old){const allowed={new:['confirmed','cancelled'],confirmed:['processing','cancelled'],processing:['ready_to_ship','cancelled'],ready_to_ship:['shipped','cancelled'],shipped:['delivered','returned'],delivered:['returned']};const opts=allowed[old]||[];if(!opts.length)return toast('لا توجد انتقالات متاحة لهذه الحالة');modal('تحديث حالة الطلب',`<div class="field"><label>الحالة الجديدة</label><select id="newStatus">${opts.map(x=>`<option value="${x}">${statuses[x]}</option>`)}</select></div><div class="field"><label>ملاحظة (اختياري)</label><input id="statusNote"></div><div class="field"><label>تاريخ التسليم المتوقع (اختياري)</label><input id="deliveryDate" type="date"></div><button class="btn primary" onclick="submitStatus('${id}')">تأكيد التغيير</button>`)}
async function submitStatus(id){const {error}=await sb.rpc('admin_set_order_status',{p_order_id:id,p_status:$('#newStatus').value,p_note:$('#statusNote').value||null,p_delivery_date:$('#deliveryDate').value||null});if(error)return toast(error.message);toast('تم تحديث حالة الطلب والمخزون حسب قواعد النظام');closeModal();go('orders')}
async function productForm(id){if(!can('products'))return toast('ليس لديك صلاحية');const [p,c]=await Promise.all([id?sb.from('products').select('*').eq('id',id).single():Promise.resolve({data:{status:'draft',price:0,cost:0}}),rows('categories','*','sort_order',true)]);if(p.error)return toast(p.error.message);const x=p.data;modal(id?'تعديل منتج':'إضافة منتج',`<form id="productForm"><div class="formgrid">${field('name','اسم المنتج',x.name,'text',true)}${field('sku','SKU',x.sku)}${field('price','سعر البيع',x.price,'number',true)}${field('cost','التكلفة',x.cost,'number')}${field('compare_at_price','السعر قبل الخصم',x.compare_at_price,'number')}${field('slug','الرابط المختصر',x.slug)}<div class="field"><label>القسم</label><select name="category_id"><option value="">بدون قسم</option>${c.map(z=>`<option value="${z.id}" ${x.category_id===z.id?'selected':''}>${esc(z.name)}</option>`)}</select></div><div class="field"><label>الحالة</label><select name="status">${['draft','published','archived'].map(z=>`<option ${x.status===z?'selected':''}>${z}</option>`)}</select></div><div class="field span2"><label>وصف مختصر</label><input name="short_description" value="${esc(x.short_description)}"></div><div class="field span2"><label>الوصف الكامل</label><textarea name="description">${esc(x.description)}</textarea></div><div class="field span2"><label>صورة المنتج الرئيسية</label><input type="file" id="prodImage" accept="image/*"></div></div>${check('is_featured','منتج مميز',x.is_featured)}${check('is_best_seller','الأكثر مبيعاً',x.is_best_seller)}${check('is_new_arrival','وصل حديثاً',x.is_new_arrival)}${check('is_offer','ضمن العروض',x.is_offer)}<button class="btn primary" type="submit">حفظ المنتج</button></form>`);$('#productForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),obj=Object.fromEntries(f.entries());['price','cost','compare_at_price'].forEach(k=>obj[k]=obj[k]===''?null:Number(obj[k]));obj.category_id=obj.category_id||null;['is_featured','is_best_seller','is_new_arrival','is_offer'].forEach(k=>obj[k]=$(`[name="${k}"]`).checked);let res=id?await sb.from('products').update(obj).eq('id',id).select().single():await sb.from('products').insert(obj).select().single();if(res.error)return toast(res.error.message);const file=$('#prodImage').files[0];if(file){const path=`${res.data.id}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await sb.storage.from('products').upload(path,file,{upsert:true});if(up.error)return toast('حُفظ المنتج لكن فشل رفع الصورة: '+up.error.message);const url=sb.storage.from('products').getPublicUrl(path).data.publicUrl;const old=await sb.from('product_images').select('id').eq('product_id',res.data.id);if(old.data?.length)await sb.from('product_images').update({is_primary:false}).eq('product_id',res.data.id);const ins=await sb.from('product_images').insert({product_id:res.data.id,url,storage_path:path,is_primary:true,sort_order:0});if(ins.error)return toast(ins.error.message)}toast('تم حفظ المنتج');closeModal();go('products')}}
function field(n,l,v='',type='text',req=false){return `<div class="field"><label>${l}</label><input name="${n}" type="${type}" value="${esc(v??'')}" ${req?'required':''}></div>`}function check(n,l,v){return `<label class="checkrow"><input type="checkbox" name="${n}" ${v?'checked':''}> ${l}</label>`}

async function sectionForm(id){const {data:x}=await sb.from('homepage_sections').select('*').eq('id',id).single();modal('تعديل قسم الصفحة',`<form id="f">${field('title','العنوان',x.title)}${field('subtitle','الوصف الفرعي',x.subtitle)}${field('sort_order','الترتيب',x.sort_order,'number')}${check('is_enabled','إظهار القسم',x.is_enabled)}<button class="btn primary">حفظ</button></form>`);$('#f').onsubmit=e=>saveForm(e,'homepage_sections',id,['sort_order'],['is_enabled'])}
async function navForm(id){const {data:x}=id?await sb.from('navigation_links').select('*').eq('id',id).single():{data:{location:'header',label:'',url:'#',is_active:true,sort_order:0}};modal('رابط التنقل',`<form id="f"><div class="field"><label>المكان</label><select name="location"><option value="header">الهيدر</option><option value="footer">الفوتر</option></select></div>${field('label','النص',x.label)}${field('url','الرابط',x.url)}${field('sort_order','الترتيب',x.sort_order,'number')}${check('is_active','ظاهر',x.is_active)}<button class="btn primary">حفظ</button></form>`);$('#f').onsubmit=e=>saveForm(e,'navigation_links',id,['sort_order'],['is_active'])}
async function settingForm(key){const {data:x}=key?await sb.from('website_settings').select('*').eq('key',key).single():{data:{key:'',value:'',is_public:true}};modal('إعداد الموقع',`<form id="f">${field('key','المفتاح',x.key,'text',true)}<div class="field"><label>القيمة (JSON أو نص)</label><textarea name="value">${esc(typeof x.value==='string'?x.value:JSON.stringify(x.value))}</textarea></div>${check('is_public','متاح للزوار',x.is_public)}<button class="btn primary">حفظ</button></form>`);$('#f').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);let value=fd.get('value');try{value=JSON.parse(value)}catch{}const obj={key:fd.get('key'),value,is_public:$('[name=is_public]').checked,updated_at:new Date().toISOString()};const r=key?await sb.from('website_settings').update(obj).eq('key',key):await sb.from('website_settings').insert(obj);if(r.error)return toast(r.error.message);toast('تم الحفظ');closeModal();go('settings')}}
async function shippingForm(id){const {data:x}=id?await sb.from('shipping_settings').select('*').eq('id',id).single():{data:{region:'',fee:0,is_available:true}};modal('إعداد الشحن',`<form id="f">${field('region','المنطقة (اتركها فارغة للافتراضي)',x.region)}${field('fee','رسوم الشحن',x.fee,'number')}${field('free_threshold','حد الشحن المجاني',x.free_threshold,'number')}${field('est_days_min','أقل مدة بالأيام',x.est_days_min,'number')}${field('est_days_max','أقصى مدة بالأيام',x.est_days_max,'number')}${check('is_available','الشحن متاح',x.is_available)}<button class="btn primary">حفظ</button></form>`);$('#f').onsubmit=e=>saveForm(e,'shipping_settings',id,['fee','free_threshold','est_days_min','est_days_max'],['is_available'],{},['region'])}
async function paymentForm(method){const {data:x}=await sb.from('payment_settings').select('*').eq('method',method).single();modal('طريقة الدفع',`<form id="f">${field('label','الاسم الظاهر',x.label)}<div class="field"><label>التعليمات</label><textarea name="instructions">${esc(x.instructions)}</textarea></div>${check('is_enabled','مفعلة',x.is_enabled)}<button class="btn primary">حفظ</button></form>`);$('#f').onsubmit=e=>saveForm(e,'payment_settings',null,[],['is_enabled'],{},[],{method})}
async function expenseForm(){modal('تسجيل مصروف',`<form id="f">${field('title','اسم المصروف','')}${field('amount','المبلغ','','number')}${field('category','التصنيف','general')}${field('spent_on','التاريخ',new Date().toISOString().slice(0,10),'date')}<button class="btn primary">حفظ المصروف</button></form>`);$('#f').onsubmit=e=>saveForm(e,'expenses',null,['amount'],[],{},[],{created_by:user.id})}
async function adminForm(uid){const {data:x}=uid?await sb.from('admin_users').select('*').eq('user_id',uid).single():{data:{user_id:'',full_name:'',role:'content_manager',is_active:true}};modal('حساب مدير',`<form id="f">${field('user_id','معرف المستخدم UUID',x.user_id,'text',true)}${field('full_name','الاسم',x.full_name)}<div class="field"><label>الدور</label><select name="role">${['super_admin','order_manager','inventory_manager','content_manager'].map(z=>`<option ${x.role===z?'selected':''}>${z}</option>`)}</select></div>${check('is_active','حساب نشط',x.is_active)}<button class="btn primary">حفظ</button></form>`);$('#f').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),obj={user_id:fd.get('user_id'),full_name:fd.get('full_name'),role:fd.get('role'),is_active:$('[name=is_active]').checked};const r=uid?await sb.from('admin_users').update(obj).eq('user_id',uid):await sb.from('admin_users').insert(obj);if(r.error)return toast(r.error.message);toast('تم الحفظ');closeModal();go('admins')}}
async function adjustStock(id,name){modal('تعديل مخزون '+name,`<form id="f">${field('delta','الزيادة أو النقص (مثال: 5 أو -2)','','number',true)}<div class="field"><label>سبب التعديل (إجباري)</label><textarea name="note" required minlength="3"></textarea></div><button class="btn primary">تنفيذ التعديل</button></form>`);$('#f').onsubmit=async e=>{e.preventDefault();const r=await sb.rpc('admin_adjust_stock',{p_variant_id:id,p_delta:Number(new FormData(e.target).get('delta')),p_note:new FormData(e.target).get('note')});if(r.error)return toast(r.error.message);toast('تم تعديل المخزون: '+r.data);closeModal();go('inventory')}}
async function saveForm(e,table,id,numbers=[],checks=[],transforms={},nullable=[],extra={}){e.preventDefault();const fd=new FormData(e.target),obj={};for(const [k,v] of fd.entries())obj[k]=v;numbers.forEach(k=>obj[k]=obj[k]===''?null:Number(obj[k]));checks.forEach(k=>obj[k]=$(`[name="${k}"]`).checked);nullable.forEach(k=>obj[k]=obj[k]||null);Object.entries(transforms).forEach(([k,fn])=>obj[k]=fn(obj[k]));Object.assign(obj,extra);const r=id?await sb.from(table).update(obj).eq('id',id):await sb.from(table).insert(obj);if(r.error)return toast(r.error.message);toast('تم الحفظ بنجاح');closeModal();go(current)}
async function deleteRow(table,id){if(!confirm('متأكد من الحذف؟'))return;const r=await sb.from(table).delete().eq('id',id);if(r.error)return toast(r.error.message);toast('تم الحذف');go(current)}
$('#loginBtn').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value;if(!email||!password)return toast('اكتب البريد وكلمة المرور');$('#loginBtn').disabled=true;const {error}=await sb.auth.signInWithPassword({email,password});$('#loginBtn').disabled=false;if(error)return toast(error.message);await verify()};
$('#password').onkeydown=e=>{if(e.key==='Enter')$('#loginBtn').click()};$('#nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)};$('#logout').onclick=async()=>{await sb.auth.signOut();admin=null;permissionSet.clear();showLogin()};$('#refresh').onclick=()=>go(current);$('#closeModal').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')showLogin()});init();
</script></body></html>
